name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter, deliberately: that filter matches a pull request's
  # *base*, so a stacked PR — one opened against another branch still in review
  # — matches nothing and runs no CI at all. The core repository merged two PRs
  # that way (#1120, #1121). `push` keeps its filter so a stacked branch does
  # not run twice.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm 10.9.8 — which is what the core pins — crashes on vitest's peer
      # graph here, so `packageManager` pins npm 11 and corepack is what makes
      # `setup-node`'s bundled npm honour it. Same mechanism as the core's
      # `use-pinned-npm` action, opposite direction.
      - name: Enable corepack for npm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          corepack enable npm
          echo "npm $(npm --version) (package.json pins $(node -p "require('./package.json').packageManager"))"

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      # `@ragenai/jobs` is on no registry, so `npm ci` cannot install it: it
      # comes out of the worker image this repository layers onto. Cached on the
      # image tag, which is pinned in the adapter's Dockerfile — a 1 GB pull per
      # run for a few hundred kilobytes of declarations would otherwise be the
      # slowest step here by an order of magnitude.
      - name: Contract cache key
        id: contract
        run: |
          tag=$(grep -oP '^ARG BASE_TAG=\K\S+' packages/jobs-temporal/Dockerfile)
          image=$(grep -oP '^ARG BASE_IMAGE=\K\S+' packages/jobs-temporal/Dockerfile)
          echo "key=${image//\//-}-${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: contract-cache
        with:
          path: node_modules/@ragenai/jobs
          key: contract-${{ steps.contract.outputs.key }}

      - name: Resolve the contract from the worker image
        if: steps.contract-cache.outputs.cache-hit != 'true'
        run: npm run contract

      # Each runs across every workspace via scripts/run-workspaces.mjs, which
      # tolerates there being none — `npm run --workspaces` treats "no
      # workspaces" as an error, and a red build on an empty scaffold says
      # nothing about the code. Kept now that there is one workspace, because
      # the next component starts the same way.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # The deployment artifact is the Dockerfile, so a build of it is the only
  # thing that says the artifact still exists. Nothing else here touches it:
  # `npm run build` compiles the adapter, which is one of the two things the
  # image layers on, and would pass just as happily with a base image that had
  # moved, a stage that no longer resolves the contract, or a COPY into a path
  # the worker cannot see.
  #
  # Not pushed. Publishing the layered image is a release decision, and this job
  # is asking a narrower question.
  image:
    name: Build the layered worker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          # The repository root, so the adapter is compiled in the same build
          # that layers it — the Dockerfile's first line says so.
          context: .
          file: packages/jobs-temporal/Dockerfile
          # The base image is published for amd64 only.
          platforms: linux/amd64
          push: false
          load: true
          tags: ragen-worker-temporal:ci
          cache-from: type=gha,scope=jobs-temporal
          cache-to: type=gha,scope=jobs-temporal,mode=max

      # There is deliberately nothing to assert after the build. The
      # Dockerfile's last stage runs `verify-layer.mjs` *inside* the image — it
      # derives the packages to resolve from the base image's own compiled
      # output and resolves each from where the worker runs — so a `COPY` into
      # the wrong `node_modules`, a base whose layout moved, or an SDK package
      # the install did not name at the top of its tree fails the step above.
      # A second check here would be a weaker copy of that one.

  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    # Dependabot writes "ci: Bump actions/setup-node from 4 to 7" — a capital B
    # that `subject-case` rejects, and `commit-message.prefix` in
    # dependabot.yml controls the prefix only. So every dependency PR would
    # fail a check about a message nobody here wrote, which is how a red tick
    # stops meaning anything. The rule stays strict for commits we author.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint needs the range, and a shallow clone has no base.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint commit messages
        run: >
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
